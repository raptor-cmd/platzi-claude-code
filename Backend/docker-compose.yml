services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: platziflix_user
      POSTGRES_PASSWORD: platziflix_password
      POSTGRES_DB: platziflix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./specs:/app/specs
    environment:
      DATABASE_URL: postgresql://platziflix_user:platziflix_password@db:5432/platziflix_db
      # Solo desarrollo: en producción definir un secreto propio y largo
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
    depends_on:
      - db

volumes:
  postgres_data: 